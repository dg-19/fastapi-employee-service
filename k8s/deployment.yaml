apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi-employee

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fastapi-employee

  template:
    metadata:
      labels:
        app: fastapi-employee

    spec:
      containers:
        - name: fastapi-container
          image: deepademo/fastapi-employee-service:latest
          
          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: fastapi-config

            - secretRef:
                name: fastapi-secret