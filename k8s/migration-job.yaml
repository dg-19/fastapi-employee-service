apiVersion: batch/v1
kind: Job

metadata:
  name: fastapi-migration

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: IMAGE_PLACEHOLDER

          command:
            - alembic
            - upgrade
            - head

          envFrom:
            - configMapRef:
                name: fastapi-config

            - secretRef:
                name: fastapi-secret